<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18252b">
  <title>考研生词 · 学习卡片</title>
  <style>
    :root { color-scheme: light; --ink: #18252b; --muted: #68757a; --line: #dce5e5; --paper: #fff; --wash: #f4f7f6; --accent: #0c766d; --accent-soft: #e5f3f0; --gold: #c9872c; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--wash); color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar { position: sticky; z-index: 10; top: 0; background: rgba(244,247,246,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
    .topbar-inner { max-width: 1360px; margin: 0 auto; padding: 22px 30px 18px; }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.45rem); letter-spacing: .01em; line-height: 1.1; }
    .kicker { margin: 0 0 8px; color: var(--accent); font-size: .74rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: .9rem; }
    .resume-button { display: none; border: 1px solid var(--accent); border-radius: 5px; padding: 9px 13px; color: var(--accent); background: var(--paper); font-weight: 700; white-space: nowrap; }
    .resume-button.visible { display: inline-flex; align-items: center; gap: 7px; }
    .resume-button:hover { background: var(--accent-soft); }
    .toolbar { display: grid; grid-template-columns: minmax(200px, 1fr) auto auto; align-items: center; gap: 15px; margin-top: 22px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 15px; top: 50%; width: 18px; height: 18px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
    #search { width: 100%; border: 1px solid #cbd8d7; border-radius: 5px; padding: 13px 15px 13px 44px; outline: 0; background: var(--paper); color: var(--ink); }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(12,118,109,.12); }
    .voice-control { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #cbd8d7; border-radius: 5px; padding: 8px 10px; background: var(--paper); color: var(--muted); font-size: .78rem; white-space: nowrap; }
    #voice-select { border: 0; outline: 0; background: transparent; color: var(--ink); font-weight: 700; cursor: pointer; }
    #voice-select:focus-visible { box-shadow: 0 0 0 3px rgba(12,118,109,.12); }
    .stats { display: flex; align-items: center; justify-content: flex-end; gap: 16px; color: var(--muted); font-size: .82rem; white-space: nowrap; }
    .stats strong { color: var(--ink); font-size: 1rem; }
    .meter { width: 110px; height: 6px; overflow: hidden; border-radius: 9px; background: #d8e4e2; }
    .meter i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
    .search-results { position: absolute; z-index: 11; top: calc(100% + 6px); left: 0; right: 0; display: none; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); box-shadow: 0 12px 30px rgba(24,37,43,.12); }
    .search-results.open { display: block; }
    .search-result { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid #edf2f1; padding: 11px 14px; text-align: left; background: transparent; color: var(--ink); }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover, .search-result:focus-visible { background: var(--accent-soft); outline: 0; }
    .search-result small { color: var(--muted); }
    main { max-width: 1360px; margin: 0 auto; padding: 28px 30px 70px; }
    .section-line { display: flex; align-items: center; justify-content: space-between; margin: 0 0 17px; color: var(--muted); font-size: .78rem; }
    .section-line span:first-child { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    /* Grid auto-flow is intentionally row-major: frequency order reads left-to-right. */
    #grid { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: 18px; }
    @media (min-width: 650px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 980px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1320px) { #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .card { display: block; width: 100%; margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: 0 2px 4px rgba(24,37,43,.025); transition: border-color .2s, box-shadow .2s, transform .2s; scroll-margin-top: 148px; }
    .card:hover { border-color: #b8cfcb; box-shadow: 0 8px 22px rgba(24,37,43,.08); transform: translateY(-1px); }
    .card.current { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(12,118,109,.10); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 13px; }
    .word { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.75rem; letter-spacing: .01em; line-height: 1; cursor: help; }
    .word:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
    .word-meta { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--muted); font-size: .82rem; }
    .phonetic { color: var(--accent); font-family: Georgia, serif; font-size: .95rem; }
    .phonetic.missing { color: #9ca9a7; font-family: inherit; font-size: .76rem; }
    .speak { display: inline-grid; flex: 0 0 auto; place-items: center; width: 34px; height: 34px; border: 1px solid #cbd8d7; border-radius: 50%; background: transparent; color: var(--accent); }
    .speak:hover, .speak:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: 0; }
    .speak svg { width: 16px; height: 16px; }
    .phonetic-button { display: inline-flex; align-items: center; gap: 4px; border: 0; padding: 0; color: inherit; background: transparent; }
    .phonetic-button:hover .phonetic { text-decoration: underline; text-underline-offset: 3px; }
    .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
    .word-id { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .68rem; letter-spacing: .04em; }
    .number { flex: 0 0 auto; border-radius: 4px; padding: 4px 7px; color: var(--gold); background: #fff7e9; font-size: .72rem; font-weight: 800; }
    .meaning { margin: 0 18px 15px; border-left: 3px solid var(--accent); padding: 3px 0 3px 11px; color: #263b3e; font-size: .93rem; line-height: 1.65; }
    .details { border-top: 1px solid #edf2f1; padding: 3px 18px 16px; }
    .detail { display: grid; grid-template-columns: 93px minmax(0, 1fr); gap: 9px; padding-top: 12px; font-size: .82rem; line-height: 1.65; }
    .detail-label { color: var(--muted); font-size: .73rem; font-weight: 800; letter-spacing: .05em; }
    .detail-value { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #405154; }
    .detail-value.empty { color: #a4afad; font-style: italic; }
    .example-button { display: inline; border: 0; border-bottom: 1px dashed var(--accent); padding: 0 2px; text-align: left; background: transparent; color: inherit; cursor: pointer; }
    .example-button:hover, .example-button:focus-visible { border-bottom-style: solid; color: var(--accent); outline: 0; }
    .example-button svg { width: 14px; height: 14px; margin-right: 5px; vertical-align: -2px; }
    .empty-state { display: none; padding: 54px 20px; border: 1px dashed #bdcecb; border-radius: 7px; text-align: center; color: var(--muted); }
    .empty-state.visible { display: block; }
    .loading { padding: 20px; color: var(--muted); text-align: center; font-size: .8rem; }
    [hidden] { display: none !important; }
    .study-toolbar, .pagination, .card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .study-toolbar { margin-top: 14px; font-size: .8rem; }
    .study-toolbar button, .pagination button, .card-actions button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    .card-actions { justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--line); }
    .card-actions button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .card-back { padding: 24px 18px; min-height: 220px; }
    .card-back .word { margin-bottom: 24px; }
    .card-back .detail-value { line-height: 1.8; }
    .card-head > div:first-child { min-width: 0; }
    .word, #progress-label { overflow-wrap: anywhere; }
    .word-meta { flex-wrap: wrap; }
    .pagination { justify-content: center; padding: 24px 0; }
    #storage-status { color: var(--muted); margin: 10px 0 0; font-size: .75rem; }
    #storage-status.error { color: #a13420; }
    #grid { scroll-margin-top: 340px; }
    .card { scroll-margin-top: 340px; }
    @media (max-width: 640px) { .topbar { position: static; } .stats { white-space: normal; } #grid, .card { scroll-margin-top: 16px; } }

    @media (min-width: 641px) and (max-width: 820px) { .toolbar { grid-template-columns: minmax(0, 1fr) auto; } .stats { grid-column: 1 / -1; justify-content: space-between; } }
    @media (max-width: 640px) { .topbar-inner { padding: 18px 16px 14px; } main { padding: 23px 16px 52px; } .masthead { display: block; } .resume-button { margin-top: 14px; } .toolbar { grid-template-columns: 1fr; gap: 10px; margin-top: 17px; } .voice-control { justify-content: space-between; } .stats { justify-content: space-between; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="masthead">
        <div><p class="kicker">Vocabulary studio</p><h1>考研生词</h1><p class="subtitle">按自己的节奏，逐词建立长期记忆</p></div>
        <button id="resume" class="resume-button" type="button" aria-label="回到上次学习位置"><span aria-hidden="true">↗</span> 继续上次学习</button>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="search" type="search" autocomplete="off" placeholder="搜索单词、释义或词性…" aria-label="搜索单词、释义或词性">
          <div id="search-results" class="search-results" role="listbox"></div>
        </div>
        <label class="voice-control" for="voice-select"><span>发音</span><select id="voice-select" aria-label="选择发音口音"><option value="en-GB" selected>英式 English (UK)</option><option value="en-US">美式 English (US)</option></select></label>
        <div class="stats"><span><strong id="visible-count">0</strong> / <span id="total-count">0</span> 词</span><span id="progress-label">未开始</span></div>
      </div>
      <div class="study-toolbar">
        <label><input id="review-only" type="checkbox"> 只看需巩固（<span id="review-count">0</span>）</label>
        <button id="export-study" type="button">导出学习记录</button>
        <button id="import-study" type="button">导入学习记录</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p id="storage-status" role="status">标记自动保存在此浏览器 · 建议定期导出备份</p>
    </div>
  </header>
  <main>
    <div class="section-line"><span id="section-title">全部词汇</span><span id="loaded-count">正在准备…</span></div>
    <section id="grid" aria-live="polite"></section>
    <div id="empty" class="empty-state">没有找到匹配的单词，请换个关键词试试。</div>
    <nav class="pagination" aria-label="词卡分页">
      <button id="previous-page" type="button">上一页</button><span id="page-label"></span><button id="next-page" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const VOCAB = [{"id":"W000001","sourceRow":"2","word":"passage","translate":"n. 段落；通道； Passage；v. 通过；传递","number":"＞100","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 pass 意为“走、过”，加后缀 -age 表示“走的过程或结果”，即“通过”或“通道”。联想：人走过一段路（passage）或一段文字（passage）。","similar_words":"passage 与 passage 易混淆：passage 指具体的“通道”或抽象的“段落”；而 passage 常指“通过”的动作或“传递”的过程。例如：a narrow passage（狭窄的通道）vs. the passage of time（时间的流逝）。","phonetic":"/ˈpæsɪʤ/"},{"id":"W000002","sourceRow":"3","word":"rent","translate":"n.租金；v.出租；租（某物）","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根rent来自拉丁语renare（再次说），联想为‘反复支付’即‘租金’。也可联想rent为‘租’，与rental（租赁的）同源。","similar_words":"rent与lease区别：rent指租金或短期租赁行为，而lease指长期租赁合同及租期本身。例如：pay rent（付租金）vs. sign a lease（签租约）。","phonetic":"/rɛnt/"},{"id":"W000003","sourceRow":"4","word":"dust","translate":"n. 灰尘；v. 拂去灰尘；dust off 拂去灰尘","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 dust 意为“灰尘”，联想“灰尘”常需“拂去”，故动词 dust 意为“拂去灰尘”。","similar_words":"无","phonetic":"/dəst/"},{"id":"W000004","sourceRow":"5","word":"formation","translate":"n. 形成；构成；组织；形成物；v. 形成；构成","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"由前缀 form-（形状、形式）+ 后缀 -ation（名词后缀）构成，字面意为‘形状化’或‘形成’。联想：form 是形状，formation 就是形状被‘形成’的过程或结果。","similar_words":"formation 与 formation 同形，但常与 form 对比：form 侧重‘塑造、构成’（动词）或‘表格、形式’（名词）；formation 侧重‘自然形成、组织结构、地质构造’等具体化或过程化的概念。","phonetic":"/fɔrˈmeɪʃən/"},{"id":"W000005","sourceRow":"6","word":"mate","translate":"n. 同伴，伙伴；v. 结婚；adj. 同类的，配套的","number":"51—99","part_of_speech":"n.; v.; adj.","transformation":"无","memory_techniques":"词根 mate 原意为“配对、结合”，联想为“两个同类事物配对在一起”，如“mates”指配偶或搭档。","similar_words":"mate 与 partner 区别：mate 强调同类或配偶关系（如 animal mates），partner 强调合作关系或商业伙伴（如 business partners）；mate 作动词时指结婚，partner 无此用法。","phonetic":"/meɪt/"},{"id":"W000006","sourceRow":"7","word":"sheet","translate":"n. 一张（纸、布等）；n. 床单；n. 薄板；v. 铺上；v. 用薄纸覆盖","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"联想：sheet 像一张薄薄的纸或床单，可以铺在床上或桌子上。词根 'she' 有‘薄’的意思，如 'sheer'（透明的、薄的）。","similar_words":"无","phonetic":"/ʃit/"},{"id":"W000007","sourceRow":"8","word":"arch","translate":"n. 拱门；拱形；n. 首席；n. 祖先；v. 拱起；v. 担任（首席）","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 arch- 意为‘拱形’或‘祖先’（如 ancestor 的源流），联想古代石拱桥（arch bridge）或家族谱系中的始祖（arch ancestor）来记忆。","similar_words":"无","phonetic":"/ɑrʧ/"},{"id":"W000008","sourceRow":"9","word":"hang","translate":"v.悬挂；挂起；逗留；(指人) 待在某处；n.悬挂物；(指人) 逗留","number":"51—99","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"联想：'hang' 让人联想到'hang on the wall'（挂在墙上），也可联想为'hang around'（逗留），形象地表示物体悬空或人停留的状态。","similar_words":"与'hang out'区别：'hang'本身可作不及物动词表示逗留，而'hang out'更强调外出闲逛、社交或放松，常指离开家或学校去外面活动。","phonetic":"/hæŋ/"},{"id":"W000009","sourceRow":"10","word":"ratio","translate":"比率；比例；比例关系；n. 比率；v. 按比例分配","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 ratio 源自拉丁语，意为‘计算’或‘比例’，可联想为‘把整体分成若干份’。","similar_words":"ratio 与 proportion 均指比例，但 ratio 强调两个量之间的数值关系（如身高与体重比），而 proportion 更侧重部分与整体的关系或协调性。","phonetic":"/ˈreɪʃiˌoʊ/"},{"id":"W000010","sourceRow":"11","word":"unit","translate":"n. 单位；单元；部分；v. 使成为单位；使统一","number":"51—99","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 unit 意为“一”，前缀 uni- 表示“单一”，联想为“单一的整体”即“单位”。","similar_words":"无","phonetic":"/ˈjunɪt/"},{"id":"W000011","sourceRow":"12","word":"ample","translate":"充足的；大量的；宽敞的","number":"51—99","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 ample 源自拉丁语，意为‘宽’或‘大’，联想为‘ample space’（宽敞的空间）或‘ample supply’（充足的供应）","similar_words":"与 abundant 对比：ample 强调数量或空间上的‘足够’或‘充裕’，常接具体资源或空间；abundant 更侧重‘丰富’、‘多到溢出’，常形容资源、人才等","phonetic":"/ˈæmpəl/"},{"id":"W000012","sourceRow":"13","word":"ought","translate":"v. 应该；ought to do sth. 应该做某事；adj. 应有的；n. 义务","number":"51—99","part_of_speech":"v.; adj.; n.","transformation":"无","memory_techniq ，字面意思为‘抓住的人’，引申为持有者或主持者。","similar_words":"无","phonetic":"/ˈhoʊldər/"},{"id":"W000138","sourceRow":"139","word":"hut","translate":"n. 小屋；棚屋；简陋的住所","number":"11—15","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 hut 源自古英语，意为‘小房子’。联想：hut 像是一个被窝，用来‘窝’在里面睡觉，所以是简陋的小屋。","similar_words":"无","phonetic":"/hət/"},{"id":"W000139","sourceRow":"140","word":"imply","translate":"v. 暗示，表明，意味着；n. 暗示","number":"11—15","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 im-（进入）+ ply（推、压），字面意为“推入某事背后”，引申为“暗示”。联想：把真相藏在后面不直接说，就是暗示。","similar_words":"imply 与 suggest 区别：imply 侧重说话者未明说但可推断出的含义（隐含），常接 that 从句；suggest 侧重提出建议或使某人想到某事，语气较委婉。例如：His silence implied guilt（他的沉默暗示有罪）vs. He suggested a plan（他提出一个计划）。","phonetic":"/ˌɪmˈplaɪ/"},{"id":"W000140","sourceRow":"141","word":"liver","translate":"n. 肝脏；n. 肝脏病；v. 使变绿；v. 使变黄","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 liver 源自拉丁语，字面意思与‘绿色’相关，因为肝脏在解剖学上呈现深绿色。联想：肝脏是身体中最大的绿色器官。","similar_words":"无","phonetic":"/ˈlɪvər/"},{"id":"W000141","sourceRow":"142","word":"pick","translate":"v. 挑选；采摘；选择；n. 挑选；小棍；（鸟）嘴","number":"11—15","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 pick 原意与‘啄食’有关，像鸟用嘴啄开东西一样，引申为‘挑选’或‘采摘’。联想：鸟嘴（pick）用来从树上摘果子。","similar_words":"pick 与 choose 都表示‘选择’，但 pick 更强调从众多选项中快速、随意地挑选，常与‘up'连用（pick up）；choose 则更正式，强调经过思考后的慎重选择。","phonetic":"/pɪk/"},{"id":"W000142","sourceRow":"143","word":"porter","translate":"搬运工；服务员；搬运；运送","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 port-（携带、搬运）+ -er（表示人），字面意思为‘携带者’，引申为搬运工或服务员。","similar_words":"无","phonetic":"/ˈpɔrtər/"},{"id":"W000143","sourceRow":"144","word":"press","translate":"n. 报纸，新闻；v. 按，压，挤压；v. 催促，迫使；v. 使紧张，使受压","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 press 意为“压”，联想“按门铃”或“按压按钮”的动作。中文“新闻”（news）常与“报纸”（press）连用，因为报纸是新闻的主要载体，故可记为“压出来的新闻”。","similar_words":"press 与 press up：press up 指“使紧张”或“使受压”，而 press 本身可指“使紧张”（如 press the situation），但 press up 更强调人为施加压力导致紧张状态。此外，press 作动词时强调“施加压力”的动作，而 press up 常作短语动词使用。","phonetic":"/prɛs/"},{"id":"W000144","sourceRow":"145","word":"radical","translate":"adj. 根本的，彻底的；n. 激进分子，激进主义","number":"11—15","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 radical 源自拉丁语 radix（根），字面意为‘根源’，引申为‘根本的’或‘彻底的’。联想：radical 像树根一样深入核心，故指根本性的改变。","similar_words":"radical 与 fundamental 均表示‘根本的’，但 radical 更强调‘激进的、彻底的’变革，常含激进色彩；fundamental 侧重‘基础的、基本的’，语气较温和。例如：radical reform（激进改革）vs. fundamental change（根本性变化）。","phonetic":"/ˈrædɪkəl/"},{"id":"W000145","sourceRow":"146","word":"scar","translate":"n. 伤疤；v. 留下伤疤；使受损","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 scar- 意为‘刻痕’，联想为皮肤上留下的‘刻痕’即伤疤。","similar_words":"scar与wound区别：wound指受伤的过程或伤口本身，而scar特指伤口愈合后留下的永久性痕迹。","phonetic":"/skɑr/"},{"id":"W000146","sourceRow":"147","word":"stock","translate":"n. 库存；股票；储备；v. 提供（货物）；把...作为库存","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根stock源自古英语stoc，意为‘树桩’，引申为‘支撑物’或‘储备’，故可联想为‘储备物资’。","similar_words":"无","phonetic":"/stɑk/"},{"id":"W000147","sourceRow":"148","word":"tribute","translate":"n. 贡品；敬意；致敬；v. 向……致敬；献祭","number":"11—15","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 tribute 源自拉丁语 tribuere（给予），可联想为‘给予的礼物’即贡品。前缀 tri- 表示‘三’，但此处主要强调‘奉献’之意，如向英雄献花致敬。","similar_words":"tribute 与 gift 的区别：gift 泛指礼物，强调给予行为本身；tribute 特指因尊敬、感激或臣服而献上的物品，常含‘贡品’或‘致敬’义，如 pay tribute to（向……致敬）。","phonetic":"/ˈtrɪbjut/"},{"id":"W000148","sourceRow":"149","word":"urge","translate":"v. 催促；强烈要求；n. 催促；强烈要求","number":"11—15","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 urge 源自拉丁语 urgere，意为‘压、推’，形象地表示用压力或紧迫感促使某人行动，可联想为‘推门’或‘催促’。","similar_words":"urge 与 press 都表示催促，但 urge 强调内心的强烈意愿或情感驱动，常用于 urge sb. to do sth.；press 更侧重外部施加的压力或紧迫感，如 press for results。","phonetic":"/ərʤ/"},{"id":"W000149","sourceRow":"150","word":"valid","translate":"adj. 有效的；有根据的；合法的","number":"11—15","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 val- 意为‘值得’或‘价值’，加上后缀 -id 构成形容词，字面意思为‘值得的’，引申为‘有效的’或‘合法的’。","similar_words":"valid 与 legal 区别：valid 强调逻辑上或事实上的有效性（如合同有效），legal 强调符合法律规定（如合法程序）；valid 与 real 区别：real 指真实存在，valid 指在特定条件下成立。","phonetic":"/ˈvælɪd/"},{"id":"W000150","sourceRow":"151","word":"verbal","translate":"口头的；用言语表达的；n. 口头语","number":"11—15","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根verbal源自拉丁语verbum（意为‘词’），字面意思就是‘用词说的’，与written（书面的）相对。","similar_words":"与oral（口语的）区别：verbal强调通过语言（包括书面文字）表达的内容，常指‘口头协议’或‘口头警告’；oral专指面对面或录音的口语交流。","phonetic":"/ˈvərbəl/"},{"id":"W000151","sourceRow":"152","word":"contract","translate":"n.合同；契约；v.收缩；签订；使契约","number":"10","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根contract来自拉丁语contractus，意为‘收缩’，前缀con-表示‘共同’，tract-表示‘拉’，合起来形象地描绘了肌肉或血管共同收缩的动作。","similar_words":"contract与conclude都涉及结束，但contract强调‘签订契约’或‘物理收缩’，而conclude侧重‘得出结论’或‘正式结束’；contract常与sign搭配，conclude常与deal或meeting搭配。","phonetic":"/ˈkɑnˌtrækt/"},{"id":"W000152","sourceRow":"153","word":"critical","translate":"adj. 关键的；批判的；危急的；n. 临界点","number":"10","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 crit- 意为“判断、批评”，前缀 -ic 表示“与...有关的”，故意为“批判的”或“关键的”。联想：critical thinking（批判性思维）","similar_words":"critical 与 crucial 均表示“关键的”，但 critical 更侧重“处于危险边缘”或“需要立即判断的”，而 crucial 更强调“决定性的、至关重要的”。critical 常作形容词修饰 situation 或 condition（危急情况）","phonetic":"/ˈkrɪtɪkəl/"},{"id":"W000153","sourceRow":"154","word":"fuel","translate":"n.燃料；v.给...提供燃料；v.为...提供动力","number":"10","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根fuel源自拉丁语fodere（投掷），原意与‘投柴’有关，引申为‘提供能量’。联想：给车加fuel（油）才能跑。","similar_words":"无","phonetic":"/fjuəl/"},{"id":"W000154","sourceRow":"155","word":"opinion","translate":"n. 意见；看法；观点","number":"10","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 op-（开口）+ inion（末端），字面意为‘张开的末端’，引申为‘看法’。可联想为‘把想法像嘴巴一样张开表达出来’。","similar_words":"opinion 与 view 同义，但 opinion 更强调个人主观判断，常与‘不同意见’（different opinions）搭配；view 更侧重‘视野’或‘观点’，常与‘不同观点’（different views）搭配。","phonetic":"/əˈpɪnjən/"},{"id":"W000155","sourceRow":"156","word":"resident","translate":"n. 居民；住户；v. 居住；定居","number":"10","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 resident 来自拉丁语 residere（居住），res-（再次）+ sedere（坐），字面意为“再次坐下”，引申为“居住在某处”。可联想为“住在某地的人”。","similar_words":"与 inhabitant 对比：resident 强调“居住”这一状态或身份，常指长期或固定居住者（如居民区）；inhabitant 更侧重“居住”这一行为或泛指某地的所有居住者（如人口统计）。","phonetic":"/ˈrɛzɪdənt/"},{"id":"W000156","sourceRow":"157","word":"spit","translate":"v. 吐口水；吐露（秘密）；n. 吐口水；喷口；（方言）小酒馆","number":"10","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 spit 意为“吐”，联想“spit fire”（喷火），形象记忆为“吐”的动作。","similar_words":"无","phonetic":"/spɪt/"},{"id":"W000157","sourceRow":"158","word":"spite","translate":"n. 怨恨；恶意；v. 故意使烦恼；使生气","number":"10","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 sp- 表示‘喷、斥’，加上 -ite 构成名词，联想为‘喷气般发泄的怨恨’。也可联想为‘spiteful’（怀恨的），词根相同。","similar_words":"无","phonetic":"/spaɪt/"},{"id":"W000158","sourceRow":"159","word":"tale","translate":"故事；传说；（长）信；（长）篇；（长）话","number":"10","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 tale 意为‘说’，联想‘讲故事’。词源来自拉丁语 talea（棍子），古时人们用棍子敲击地面发出声音来讲述故事，故有‘故事’之意。","similar_words":"tale 与 story 同义，但 tale 常指民间传说、神话故事或虚构的长篇故事，语气较正式或带有传奇色彩；story 更通用，可指日常琐事、新闻或虚构故事。","phonetic":"/teɪl/"},{"id":"W000159","sourceRow":"160","word":"traffic","translate":"n. 交通；车流；v. 交通；流通","number":"10","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 traffic 源自拉丁语，意为‘移动’或‘流动’，联想为车辆在路上‘流动’形成交通。","similar_words":"无","phonetic":"/ˈtræfɪk/"},{"id":"W000160","sourceRow":"161","word":"bound","translate":"adj. 必然的，不可避免的；v. 束缚，限定；n. 束缚，界限","number":"9","part_of_speech":"adj.; v.; n.","transformation":"无","memory_techniques":"词根 bound 意为“捆绑、束缚”，联想为“被绑住的人必然要留下”，引申为“必然发生”。","similar_words":"bound 与 boundless 区别：bound 指具体的束缚或必然性，boundless 指无边无际（无限制）。","phon eech":"v.","transformation":"无","memory_techniques":"词根 pro-（向前）+ long（长），字面意为‘向前延伸’，引申为时间或距离的延长。","similar_words":"与extend区别：extend侧重‘扩展范围或延长长度’，常接具体物体或空间；prolong侧重‘使时间或过程持续更久’，常接时间、生命或状态。","phonetic":"/prəˈlɔŋ/"},{"id":"W000168","sourceRow":"169","word":"prospect","translate":"前景；展望；可能性","number":"9","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 prospect 意为“看、望”，前缀 pro- 表示“向前”，合起来就是“向前看”，引申为未来的前景或展望。","similar_words":"prospect 与 perspective 区别：prospect 指具体的前景、可能性或远景（常接 of）；perspective 指观察事物的角度、观点或透视关系。","phonetic":"/ˈprɑspɛkt/"},{"id":"W000169","sourceRow":"170","word":"revolution","translate":"n. 革命；剧变；革命者；v. 革命；使发生剧变","number":"9","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 rev-（向后/返回）+ olution（过程），字面意为‘向后转动’，引申为根本性的变革或推翻旧制度。","similar_words":"与reformation（改革）对比：revolution指彻底推翻旧制度建立新秩序（如法国大革命），程度更深；reformation指在原有基础上进行改良（如宗教改革）。","phonetic":"/ˌrɛvəˈluʃən/"},{"id":"W000170","sourceRow":"171","word":"rival","translate":"n. 竞争对手；v. 与...竞争；vi. 竞争","number":"9","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 rival 源自拉丁语，意为“敌人”或“对手”，联想为“在战场上对抗的人”。","similar_words":"与 rival 对比：peer 指地位、能力相当的人，侧重平等；competitor 强调在商业或体育等具体领域争夺利益或名次，rival 更侧重长期的、全方位的竞争关系。","phonetic":"/ˈraɪvəl/"},{"id":"W000171","sourceRow":"172","word":"saw","translate":"n. 锯；v. 锯；看见；看到","number":"9","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词源来自古英语'saew'，意为'锯子'，引申为'锯的动作'及'看见'（因锯子可切割物体，故有洞察之意）。","similar_words":"无","phonetic":"/sɔ/"},{"id":"W000172","sourceRow":"173","word":"solar","translate":"太阳的；日光的；太阳系的","number":"9","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 solar 源自拉丁语 sol（太阳），前缀 -ar 表示“与...有关的”，直译即“太阳的”。可联想为太阳能板（solar panel）或太阳系（solar system）来记忆。","similar_words":"无","phonetic":"/ˈsoʊlər/"},{"id":"W000173","sourceRow":"174","word":"spy","translate":"n.间谍；v.窥探；侦察；偷看","number":"9","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根spy源自拉丁语spicere（看），前缀s-表示动作，整体 ess' (看见) + 'ness' (状态)，即‘看见某事的人’。也可联想为‘witness’与‘witness box’（证词箱）相关，强调亲眼所见。","similar_words":"与 observe 对比：witness 强调亲眼目睹并作为证据（如 witness a crime），侧重客观事实；observe 强调有意识地注意、观察或遵守规则（如 observe a rule），侧重主观行为。","phonetic":"/ˈwɪtnəs/"},{"id":"W000197","sourceRow":"198","word":"conduct","translate":"n.行为，举止；v.实施，执行；引导，带领；传导，传递","number":"7","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 conduct 源自拉丁语，意为‘引导’或‘带领’。联想：‘conducting a meeting’（主持会议）或‘conduct electricity’（传导电流），核心在于‘引导’或‘传递’的动作。","similar_words":"conduct 与 conduct 易混淆，但二者拼写相同。主要区别在于：conduct 作动词时强调‘实施’（如 conduct an experiment）或‘管理’（如 conduct a survey）；作名词时指‘行为’（如 good conduct）。注意不要与 conduct（引导）混淆，此处指同一词的不同用法。","phonetic":"/ˈkɑndəkt/"},{"id":"W000198","sourceRow":"199","word":"crude","translate":"adj. 粗糙的；原始的；粗俗的；n. 原油；粗料","number":"7","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 crud- 意为‘粗糙、未加工’，联想为‘未经打磨的石头’或‘未提炼的原油’，故指原始或粗糙的状态。","similar_words":"与raw对比：raw强调‘未经处理’（如raw meat生肉），crude更侧重‘质量低劣、粗糙或粗俗’（如crude language粗俗语言）；与rough对比：rough多指‘表面不平’或‘艰难’，crude常指‘本质上的原始或简单’。","phonetic":"/krud/"},{"id":"W000199","sourceRow":"200","word":"digital","translate":"数字的；数码的；电子的","number":"7","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 digit 意为‘手指’，古代用十根手指计数，故 digit 与数字相关；digital 即‘基于手指计数的’，引申为数字或电子形式。","similar_words":"无","phonetic":"/ˈdɪʤɪtəl/"},{"id":"W000200","sourceRow":"201","word":"diver","translate":"潜水员；跳水运动员","number":"7","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 dive（潜水）+ 后缀 -er（表示人），字面意思就是‘潜水的人’。联想：像鱼一样潜入水中的人。","similar_words":"无","phonetic":""},{"id":"W000201","sourceRow":"202","word":"dome","translate":"圆顶；穹顶；圆顶形；（尤指）圆顶形建筑","number":"7","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 dom- 意为‘统治、拥有’，dome 原指‘统治者的住所’，引申为‘圆顶建筑’。联想：圆顶像皇冠，象征统治者的权威。","similar_words":"无","phonetic":"/doʊm/"},{"id":"W000202","sourceRow":"203","word":"fault","translate":"n. 错误，过失，缺点；v. 归咎于，指责","number":"7","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根fault源自拉丁语faulere，意为‘弯曲’或‘倾斜’，引申为‘偏离正轨’即犯错。联想：身体弯曲（fault）时容易摔倒，比喻做事出错。","similar_words":"fault与mistake区别：fault强调主观上的过失、缺点或责任（常指人的错误），mistake强调客观上的误判或错误（常指认知偏差）。例如：He made a mistake in calculation（计算出错）vs. He is at fault for the delay（延误是他的责任）。","phonetic":"/fɔlt/"},{"id":"W000203","sourceRow":"204","word":"interior","translate":"n. 内部，内层；adj. 内部的，室内的","number":"7","part_of_speech":"n.; adj.","transformation":"无","memory_techniques":"词根 inter-（在...之间）+ interior（内部），字面意思为“在物体内部”。联想：房间的内部区域（interior room）或建筑物的内墙。","similar_words":"与 exterior 对比：interior 指内部、里面，exterior 指外部、外面。例如：interior design（室内设计）vs. exterior design（外观设计）。","phonetic":"/ˌɪnˈtɪriər/"},{"id":"W000204","sourceRow":"205","word":"occasion","translate":"n. 场合；时机；事件；n. 节日；纪念日","number":"7","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 occ-（出现）+ -asion（动作/事件），字面意为‘出现之时’，引申为特定场合或时机。","similar_words":"occasion 与 opportunity 区别：occasion 强调具体的‘场合’或‘事件’（如 a special occasion），常与 on 连用（on the occasion of）；opportunity 强调‘机会’，侧重做某事的可能性，常与 to do 连用（have an opportunity to do）","phonetic":"/əˈkeɪʒən/"},{"id":"W000205","sourceRow":"206","word":"odd","translate":"adj. 奇数的；古怪的；n. 奇数；差异；vt. 使感到奇怪","number":"7","part_of_speech":"adj.; n.; vt.","transformation":"无","memory_techniques":"词根 odd 源自拉丁语，原意与‘分开’、‘分离’有关，引申为‘不合常规’。联想：两个奇数相加得偶数，体现‘不同类’的对比。","similar_words":"odd 与 even 相对，前者指奇数或不寻常，后者指偶数或正常。odd 还可作动词，意为‘使感到奇怪’，而 even 无此用法。","phonetic":"/ɑd/"},{"id":"W000206","sourceRow":"207","word":"phrase","translate":"短语；n. 短语；v. 用短语表达","number":"7","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 phrase 意为‘抓握’，联想为‘抓住几个词组成一个短语’。也可联想为‘phr-ase’像‘phraseology’（短语学）的缩写。","similar_words":"无","phonetic":"/freɪz/"},{"id":"W000207","sourceRow":"208","word":"positive","translate":"adj. 积极的，正面的；n. 阳性，正极；adj. 肯定的，确定的","number":"7","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 pos-（放置）+ -itive（形容词后缀），意为‘被放置的’，引申为‘积极的’或‘肯定的’  cement 意为“粘合”，联想为“把两块石头用水泥粘在一起”，引申为使事物紧密结合。","similar_words":"无","phonetic":"/sɪˈmɛnt/"},{"id":"W000220","sourceRow":"221","word":"commodity","translate":"商品；物资；可贸易物","number":"6","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 com-（共同）+ modus（方式/模式）+ -ity（名词后缀），字面意为‘共同拥有的方式’，引申为可流通的商品。可联想为‘大家都能交易的东西’。","similar_words":"commodity 与 goods 区别：commodity 强调‘可交易性’和‘标准化’（如石油、小麦），常作不可数名词；goods 泛指‘货物’，可数也可不可数，侧重实物本身。","phonetic":"/kəˈmɑdəti/"},{"id":"W000221","sourceRow":"222","word":"comparison","translate":"比较；对比；比较级","number":"6","part_of_speech":"n.","transformation":"无","memory_techniques":"由compare（比较）加后缀-sion构成，表示比较的结果或过程。联想：把两个东西放在一起比来比去，就是comparison。","similar_words":"与comparision（拼写错误，正确为comparison）或comparative（形容词）区别：comparison是名词，指比较的行为或结果；comparative是形容词，意为“比较的”或“比较级的”。","phonetic":"/kəmˈpɛrəsən/"},{"id":"W000222","sourceRow":"223","word":"derive","translate":"v. 推导；源自；得到；v. 产生（结果或影响）","number":"6","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 derive 可联想为 'der'（向下/来自）+ 'ive'（动词后缀），意为‘从某处获得’。可联想为‘推导’：从前提推导结论。","similar_words":"与 obtain 对比：obtain 强调‘获得’（通常指实物或机会），侧重结果；derive 强调‘源自’或‘推导’，侧重来源或逻辑过程。例如：derive from（源自）vs. obtain from（从...获得）；derive a conclusion（推导结论）vs. obtain a result（得到结果）。","phonetic":"/dəraɪv/"},{"id":"W000223","sourceRow":"224","word":"desert","translate":"n. 沙漠；v. 放弃；遗弃；抛弃","number":"6","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 desert 源自拉丁语 des-（离开）+ sert（给予），字面意为“离开某地”，引申为“放弃”或“荒废之地”。联想：人离开土地，土地就成了沙漠。","similar_words":"与 abandon 对比：desert 强调彻底抛弃或长期离开（如 desert one's post），常含负面色彩；abandon 侧重放弃责任、计划或习惯，范围更广。典型用法：desert the battlefield（弃阵）vs. abandon a project（放弃项目）。","phonetic":"/ˈdɛzərt/"},{"id":"W000224","sourceRow":"225","word":"deserve","translate":"v. 应得；值得；配得上","number":"6","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 de-（表示否定或强调）+ serve（服务），字面意为“值得服务”或“应得回报”，引申为“配得上”。","similar_words":"与 deserve 易混淆的词：desire（渴望，不及物动词，后接宾语需用介词）；deserve 强调客观应得（如 deserve praise），desire 强调主观愿望（如 desire success）。","phonetic":"/dɪˈzərv/"},{"id":"W000225","sourceRow":"226","word":"entertain","translate":"v. 招待；款待；娱乐；使感兴趣","number":"6","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 ent-（进入）+ tain（保持），字面意为‘让某人进入并留住’，引申为招待或使感兴趣。联想：把客人‘请进来’（entertain）并‘留住’（tain）。","similar_words":"与entertain对比：entertain侧重‘招待客人’或‘使某人感到有趣’；而amuse侧重‘逗乐’，对象常为儿童或无聊者，程度较轻。例如：The host entertained the guests（主人招待客人）；The cartoon amused the children（卡通逗乐了孩子）。","phonetic":"/ˌɛnərˈteɪn/"},{"id":"W000226","sourceRow":"227","word":"excessive","translate":"过度的；过量的；极端的","number":"6","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 ex-（向外）+ cess（停止）+ -ive（形容词后缀），字面意为‘向外过度’，引申为超出正常限度。","similar_words":"与 excess 对比：excess 是名词，指‘过量’这一事实或状态；excessive 是形容词，用于修饰名词，描述‘过量的’性质。","phonetic":"/ɪkˈsɛsɪv/"},{"id":"W000227","sourceRow":"228","word":"exclusive","translate":"adj. 专有的；排他的；独有的；n. 独家报道","number":"6","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 ex-（向外）+ clusive（包含），字面意为‘向外排除其他’，故指‘独有的’或‘排他的’。","similar_words":"与exclusively（副词）对比：exclusive作形容词修饰名词，exclusively作副词修饰动词或形容词，如exclusive rights（专有权利）vs. exclusively in the store（仅在店内销售）。","phonetic":"/ɪkˈsklusɪv/"},{"id":"W000228","sourceRow":"229","word":"explosion","translate":"n. 爆炸；爆发；突然发生的事","number":"6","part_of_speech":"n.","transformation":"无","memory_techniques":"词根explos-表示‘爆炸’，源自拉丁语explosus（被炸开）。联想：explosion像炸弹爆炸一样突然且猛烈。","similar_words":"无","phonetic":"/ɪkˈsploʊʒən/"},{"id":"W000229","sourceRow":"230","word":"gift","translate":"n. 礼物；天赋；恩赐；v. 赠送；使具有某种才能","number":"6","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 gift 意为“给予”，前缀 g- 表示给予的动作，整体联想为“被给予的东西即礼物”。也可联想为“天赋”是上天“给予”人的能力。","similar_words":"无","phonetic":"/gɪft/"},{"id":"W000230","sourceRow":"231","word":"grand","translate":"adj. 宏伟的，巨大的；n. 祖父；adj. 盛大的，隆重的","number":"6","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 grand 意为“大的”，联想“grandma”（奶奶）是祖父辈的长辈， in 强调彻底破坏或导致无法挽回的损失，常指声誉、健康或整体状态；destroy 更通用，指物理或抽象事物的彻底消灭。","phonetic":"/ruɪn/"},{"id":"W000335","sourceRow":"336","word":"sacrifice","translate":"n. 牺牲；v. 牺牲；献祭；舍弃","number":"4","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 sac-（神圣的）+ -ifice（做...的人/事），字面意为“神圣的奉献”，引申为为了更高目标而舍弃个人利益。","similar_words":"与surrender（投降、放弃控制权）不同，sacrifice强调主动舍弃珍贵之物以换取更大利益；与give up（放弃）相比，sacrifice更具庄重感和牺牲精神。","phonetic":"/ˈsækrəˌfaɪs/"},{"id":"W000336","sourceRow":"337","word":"sensitivity","translate":"n. 敏感性；灵敏性；敏感度","number":"4","part_of_speech":"n.","transformation":"无","memory_techniques":"由sensitive（敏感的）加后缀-ity构成，表示‘敏感的状态或性质’。联想：sensitive像‘敏感神经’，加上-ity变成一种‘特质’。","similar_words":"与sensibility对比：sensitivity侧重对外界刺激（如光、热、声音）的反应能力，常用于科学或技术语境；sensibility侧重情感上的细腻或易受感动，常用于文学或心理语境。","phonetic":"/ˌsɛnsɪˈtɪvɪti/"},{"id":"W000337","sourceRow":"338","word":"substantial","translate":"adj. 大量的；实质性的；坚固的","number":"4","part_of_speech":"adj.","transformation":"无","memory_techniques":"由前缀 sub-（下、在...之下）+ substantial（实质的）构成，字面意为‘在底部或基础上的实质内容’，引申为‘大量的、坚固的’。可联想为‘地基（sub）必须扎实（substantial）’。","similar_words":"与 substantial 易混淆的词有 substantial 和 substantial。substantial 强调‘数量大、质量实’（如 substantial evidence 确凿证据）；substantial 常指‘重要的、有分量的’（如 substantial improvement 显著改善）。两者核心区别在于：substantial 侧重客观的‘量大/质实’，substantial 侧重主观的‘重要/关键’。","phonetic":"/səbˈstænʃəl/"},{"id":"W000338","sourceRow":"339","word":"thick","translate":"adj. 厚的；浓密的；n. 厚度；厚物","number":"4","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"联想：'thick' 让人想到'厚'，如'厚脸皮'（thick-skinned）或'浓密头发'（thick hair）。词根'th-'表'厚'，如'thickness'。","similar_words":"与'thick'对比：'thick'指物理厚度或密度大；'fat'指脂肪多或丰满；'dense'指密集或浓密（如空气、人群）。","phonetic":"/θɪk/"},{"id":"W000339","sourceRow":"340","word":"tolerate","translate":"v. 忍受；容忍；经受（痛苦、困难等）","number":"4","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 tolerate 可联想为 'tol' (忍受) + 'erate' (化/状态)，字面意为‘化为可承受的状态’。也可联想为‘容忍’即‘把难以承受的事变得能承受’。","similar_words":"与 endure 对比：tolerate 侧重‘勉强忍受’，常含‘虽不情愿但不得不接受’的意味；endure 侧重‘持久地承受’，强调时间上的延续性和韧性。例如：tolerate noise（忍受噪音）vs. endure hardship（经受磨难）。","phonetic":"/ˈtɑlərˌeɪt/"},{"id":"W000340","sourceRow":"341","word":"triumph","translate":"胜利；成功；凯旋；n. 胜利；v. 获胜；v. 庆祝胜利","number":"4","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 tri-（三）+ -umph（声音/欢呼），联想为“三次欢呼”代表大获全胜。","similar_words":"与victory对比：triumph强调经过努力后的重大成功或凯旋，常含戏剧性色彩；victory更通用，指任何竞争中的获胜。","phonetic":"/traɪəmf/"},{"id":"W000341","sourceRow":"342","word":"victim","translate":"受害者；牺牲品；受难者","number":"4","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 vic- 意为‘走’或‘失败’，加上 -tim 表示‘遭受’，联想为‘走投无路的人’或‘被迫承受痛苦的人’。","similar_words":"victim 与 casualty 区别：victim 强调人为的受害者或受迫害者，常含道德或情感色彩；casualty 多指战争、事故中的伤亡者，侧重统计数字。","phonetic":"/ˈvɪktɪm/"},{"id":"W000342","sourceRow":"343","word":"vital","translate":"adj. 至关重要的；有生命的；基本的","number":"4","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 vital 源自拉丁语 vita（生命），字面意思就是‘与生命有关的’，引申为‘至关重要的’。可联想为‘生命’是‘关键’所在。","similar_words":"无","phonetic":"/ˈvaɪtəl/"},{"id":"W000343","sourceRow":"344","word":"vocation","translate":"职业；天职；专门从事的工作","number":"4","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 voc-（呼叫）+ -ation（名词后缀），意为‘被召唤去做某事’，引申为‘职业’或‘天职’。可联想为‘被上帝召唤去从事的工作’。","similar_words":"与career（职业生涯，强调长期发展）和job（普通工作，强调具体任务）对比：vocation强调个人热情、天赋与使命感的结合，常指‘天职’；career侧重职业晋升路径；job侧重日常雇佣关系。","phonetic":"/voʊˈkeɪʃən/"},{"id":"W000344","sourceRow":"345","word":"volcano","translate":"火山；喷发","number":"4","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 vol-（飞）+ -cano（像狗一样狂吠），联想为火山喷发时岩浆像野兽一样咆哮着喷涌而出。","similar_words":"无","phonetic":"/vɑlˈkeɪnoʊ/"},{"id":"W000345","sourceRow":"346","word":"withdraw","translate":"v. 撤回；撤退；提取；退出；n. 撤回；撤退","number":"4","part_of_speech":"v.; n.","transformation":"withdrawal","memory_techniques":"词根 with-（与）+ draw（拉），字面意为‘把东西拉回来’，引申为‘撤回’或‘提取’。联想：把钱从账户里‘拉’出来就是 withdraw 存款。","similar_words":"withdraw 与 take out 区别：withdraw 强调从原处收回或退出（如资金、成员、军队），含正式或被动意味；take out 侧重从外部取出或带出（如物品、食物），更口语化。例如：withdraw money（取钱）vs. take out trash（倒垃圾）。","phonetic":"/wɪθˈdrɔ/"},{"id":"W000346","sourceRow":"347","word":"Antarctic","translate":"南极的；南极的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根分析：anti-（前缀，意为‘反对’或‘相反’）+ arctic（北极），字面意为‘与北极相反的’，即南极。","similar_words":"无","phonetic":""},{"id":"W000347","sourceRow":"348","word":"barn","translate":"n. 谷仓；棚屋；（苏格兰）乡村；n. 谷仓（用于储存谷物）","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根记忆：'bar'（屏障、门）+ 'n'（名词后缀），想象一扇大铁门（bar）围起来的房子（n），即谷仓。","similar_words":"无","phonetic":"/bɑrn/"},{"id":"W000348","sourceRow":"349","word":"campaign","translate":"n. 运动，活动；战役，战斗；v. 进行（政治或商业）活动，发动（运动）","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 cam-（走，行动）+ paign（战斗），联想为‘行走的战斗’即‘战役’或‘宣传活动’。","similar_words":"与expedition（远征，探险）对比：campaign强调有组织的、持续性的活动（如政治竞选、军事战役），而expedition更侧重一次性的探索或派遣任务。","phonetic":"/kæmˈpeɪn/"},{"id":"W000349","sourceRow":"350","word":"cluster","translate":"n. 一簇，一群；v. 聚集，簇拥","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 cluster 源自拉丁语 clustere，意为‘聚集’，可联想为‘把东西聚在一起’。","similar_words":"cluster 与 group 区别：cluster 强调紧密聚集（如花朵成簇），group 侧重人为分组或较大范围的集合。","phonetic":"/ˈkləstər/"},{"id":"W000350","sourceRow":"351","word":"congress","translate":"n. 国会；会议；议会","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 con-（共同）+ gress（走），字面意为‘共同行走’，引申为‘共同集会’，如美国国会。","similar_words":"无","phonetic":"/ˈkɑŋgrəs/"},{"id":"W000351","sourceRow":"352","word":"conquer","translate":"v. 征服；战胜；攻克","number":"3","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 con-（共同）+ quer（询问/寻求），字面意为‘共同寻求’，引申为‘征服’。联想：征服敌人需要共同目标（如国家、理想）的凝聚。","similar_words":"conquer 与 defeat：conquer 强调最终彻底战胜（如国家、敌人、困难），常与 territory, heart, mind 搭配；defeat 侧重在战斗中击败对手，常与 enemy, army, opponent 搭配。","phonetic":"/ˈkɑŋkər/"},{"id":"W000352","sourceRow":"353","word":"conservative","translate":"保守的；保守主义；保守派","number":"3","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根conserv-意为“保存、保持”，前缀re-表示“再次”，合起来即“再次保存”，引申为“保守”。可联想为“守旧派”。","similar_words":"与liberal（自由的、开明的）相对，conservative强调维持现状、避免变革，而liberal主张开放、进步和改革。","phonetic":"/kənˈsərvətɪv/"},{"id":"W000353","sourceRow":"354","word":"consult","translate":"v. 咨询；商议；查阅；请教","number":"3","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 consult 可联想为 'consultant'（顾问），即 'con'（共同）+ 'sult'（结果），意为共同商讨以达成结果。","similar_words":"与 advise 对比：consult 强调向专家或权威人士寻求专业意见（如 consult a doctor），侧重过程；advise 侧重给出建议或劝告（如 advise someone to do something），侧重结果。","phonetic":"/kənˈsəlt/"},{"id":"W000354","sourceRow":"355","word":"deduce","translate":"v. 推论，演绎，推断；n. 推论，演绎","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 de-（向下、离开）+ duce（引导、引出），字面意为‘向下引导’，引申为从前提推导出结论。联想：像侦探从线索（duce）向下（de）挖掘真相。","similar_words":"与deduce对比：deduce强调从已知事实逻辑推导出结论（如：deduce the conclusion from the evidence）；infer侧重通过观察迹象推测未明说的内容（如：infer his intention from his behavior），两者常互换但deduce更重逻辑严密性。","phonetic":"/dɪˈdus/"},{"id":"W000355","sourceRow":"356","word":"democratic","translate":"民主的；民主制度的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 demo-（人民）+ -atic（形容词后缀），意为‘属于人民的’，即民主的。可联想为‘人民当家作主’。","similar_words":"无","phonetic":"/ˌdɛməˈkrætɪk/"},{"id":"W000356","sourceRow":"357","word":"discern","translate":"v. 辨别，察觉，看出；n. 辨别力","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 discern 可联想为 'discern' -> 'discernible' (可辨别的)。词根 'cern' 意为 '辨别'，前缀 'dis-' 加强语气，类似 'discern' 和 'discernible' 的对应关系。","similar_words":"与 perceive 对比：perceive 侧重“感知、察觉”（感官或意识层面），discern 侧重“仔细辨别、看出”（强调从模糊中看清细节），如 discern the truth 比 perceive the truth 更强调洞察力。","phonetic":"/dɪˈsərn/"},{"id":"W000357","sourceRow":"358","word":"disregard","translate":"忽视；不顾；轻视；n. 忽视；不顾","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 dis-（否定，不）+ regard（看待，注意）。字面意思为‘不看待’，引申为‘忽视’或‘不顾’。","similar_words":"与 ignore 对比：ignore 侧重‘不予理会’，常指对某人或某事故意不理睬；disregard 侧重‘轻视、蔑视’，隐含对某事物价值或重要性的否定，语气更强。","phonetic":"/ˌdɪsrɪˈgɑrd/"},{"id":"W000358","sourceRow":"359","word":"drastic","translate":"adj. 猛烈的；严厉的；彻底的；急剧的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 drastic 可联想为 'drastic' 像 'drastic' 的 'drastic' 动作，如 'drastic' 措施。词根 'drastic' 源自拉丁语 'drasticus'，意为 '猛烈的'。","similar_words":"与 radical 对比：drastic 强调手段的极端性和突然性（如 drastic measures），常指为解决问题而采取的非常规、剧烈措施；radical 强调根本性的、彻底的改变（如 radical change），侧重从根源上解决问题。","phonetic":"/ˈdræstɪk/"},{"id":"W000359","sourceRow":"360","word":"elaborate","translate":"v. 详细阐述；精心制作；n. 详尽的说明；精致的细节","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 elab- 意为‘制作、加工’，结合后缀 -ate 构成动词，联想‘把东西加工得很精细’。","similar_words":"elaborate 与 elaborate 易混淆，但二者拼写相同；常与 elaborate 对比的是 elaborate（详细地）与 elaborate（精心制作的），前者侧重描述过程详尽，后者侧重结果精致。","phonetic":"/ɪˈlæbərˌeɪt/"},{"id":"W000360","sourceRow":"361","word":"eliminate","translate":"v. 消除；根除；淘汰；n. 消除；淘汰","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 el-（离开）+ im-（使）+ -inate（动词后缀），意为‘使离开’，引申为消除或淘汰。联想：把不需要的东西‘eliminate’掉，就像把垃圾‘离开’房间一样。","similar_words":"eliminate 与 remove 区别：eliminate 强调彻底根除、排除（如消除隐患、淘汰选手），常接抽象概念或竞争对象；remove 侧重物理上的移走或去除（如移除物品、解雇），语气较中性。","phonetic":"/ɪˈlɪməˌneɪt/"},{"id":"W000361","sourceRow":"362","word":"embrace","translate":"v. 拥抱；包含；采纳；n. 拥抱；接纳","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 em-（向外）+ brace（支撑、拥抱），字面意为‘张开双臂’。联想：像拥抱一样紧紧抱住某人或某事。","similar_words":"与adopt（正式采纳、收养）对比：embrace强调情感上的接纳或整体包含，adopt侧重正式决定或法律上的收养。","phonetic":"/ɪmˈbreɪs/"},{"id":"W000362","sourceRow":"363","word":"excuse","translate":"n. 借口，原谅；v. 原谅，为……辩护","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 ex-（向外）+ cuse（指责），字面意为‘向外推卸责任’，即找借口。联想：excuse 就像把错误‘推出去’给别人。","similar_words":"与 excuse 易混淆词：excuse（名词/动词，指借口或原谅的行为）vs. excusable（形容词，可原谅的）。核心区别：excuse 是行为或理由本身，excusable 是性质描述。","phonetic":"/ɪkˈskjuz/"},{"id":"W000363","sourceRow":"364","word":"fertile","translate":"adj. 肥沃的；多产的；富有成效的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根fert-（携带、带来）+ile（形容词后缀），字面意为‘带来丰富’，联想为土地带来丰富养分。","similar_words":"与fruitful对比：fertile强调‘能产生’（如土地、土壤），侧重潜力；fruitful强调‘已产生’（如成果、收获），侧重结果。","phonetic":"/ˈfərtəl/"},{"id":"W000364","sourceRow":"365","word":"flavour","translate":"风味；味道；风味物质","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根flav-意为‘颜色’，源于拉丁语flavis（黄色），因黄色常与成熟水果相关，故引申为‘味道’或‘风味’。","similar_words":"flavour与flavor同义，主要区别在于英式英语多用flavour，美式英语多用flavor，考研中两者通用，但需注意英式拼写规范。","phonetic":"/ˈfleɪvər/"},{"id":"W000365","sourceRow":"366","word":"fortune","translate":"n. 财富；运气；命运","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 fort-（强壮、有力）+ -une（名词后缀），字面意为‘强大的力量’，引申为财富或命运。联想：Fortune Teller（算命先生）靠‘运气’预测未来。","similar_words":"fortune 与 luck 区别：fortune 指具体的财富或不可改变的命运，常作不可数名词；luck 指运气的好坏，可指代某次具体事件的结果，也可指代一般运气。","phonetic":"/ˈfɔrʧən/"},{"id":"W000366","sourceRow":"367","word":"frontier","translate":"n. 边疆；前沿；新领域；v. 开拓；开辟","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 front（前）+ ier（人/状态），字面意为“在前面的人或地方”，引申为边界或新领域。联想：站在 frontier 上就是站在世界的前沿。","similar_words":"与frontier对比：frontier指地理或抽象的‘边界/前沿’，强调未知或边缘地带；而border指两个实体（如国家、地区）之间的‘国界线’，强调分隔作用。","phonetic":"/frənˈtɪr/"},{"id":"W000367","sourceRow":"368","word":"germ","translate":"n. 细菌；微生物；病菌；胚芽；种子；n. 错误；缺点；n. 起源；根源","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 germ 意为“种子、胚胎”，联想为“细菌是生命的微小种子”。","similar_words":"无","phonetic":"/ʤərm/"},{"id":"W000368","sourceRow":"369","word":"grammar","translate":"语法；语法规则","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 gram- 意为‘重量’或‘度量’，引申为‘规则’或‘结构’，故 grammar 指语言的结构规则。联想：像称量物品一样，语言也有其固定的‘重量’（规则）.","similar_words":"无","phonetic":"/ˈgræmər/"},{"id":"W000369","sourceRow":"370","word":"harbour","translate":"n. 港口；v. 为...提供住所；容纳；庇护","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 harbour 可联想为 harbor（港），词根 har- 意为“保护、庇护”，-bour 表示“地方”，合起来即“提供庇护的地方”，引申为港口或收容。","similar_words":"harbour 与 harbor 拼写不同，英式拼写为 harbour，美式为 harbor，含义相同；与 harbor 相比，harbor 更常用于美式英语，而 harbour 在英式英语中更常见。","phonetic":""},{"id":"W000370","sourceRow":"371","word":"heap","translate":"n. 堆，堆状物；v. 堆起，堆积；adj. 大量的，成堆的","number":"3","part_of_speech":"n.; v.; adj.","transformation":"无","memory_techniques":"词根heap源自古英语，意为‘堆’。联想：heap像金字塔一样层层堆叠，形象地表示堆积的动作或状态。","similar_words":"heap与pile区别不大，但heap更强调随意堆砌，常含贬义（如heap of trash）；pile则更中性，指整齐或大量堆叠（如pile of books）。","phonetic":"/hip/"},{"id":"W000371","sourceRow":"372","word":"hesitate","translate":"犹豫；迟疑；踌躇；n.犹豫不决","number":"3","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 hesit- 源自拉丁语，意为“站立不动”，联想为“站在原地不动”即犹豫不决。前缀 re- 表示重复，re-hesitate 可联想为反复犹豫。","similar_words":"hesitate 与 stall 区别：hesitate 指因思考或顾虑而暂时停顿，常接 to do sth.；stall 指故意拖延时间或使机器故障，常接 for time。","phonetic":"/ˈhɛzəˌteɪt/"},{"id":"W000372","sourceRow":"373","word":"ignorant","translate":"adj. 无知的；愚昧的；n. 无知；愚昧的人","number":"3","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根ignor-（隐藏、不知）+ -ant（人/状态），联想为“看不见真相的人”，即无知者。","similar_words":"与ignorant（无知）对比ignorant（形容词）与ignorance（名词，无知状态），前者描述人，后者描述状态；与uninformed（未受信息影响）不同，ignorant强调缺乏知识或教育，常含贬义。","phonetic":"/ˈɪgnərənt/"},{"id":"W000373","sourceRow":"374","word":"imitation","translate":"模仿；仿制品；n. 模仿；v. 模仿","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 im-（进入）+ -itate（使...）+ -ion（名词后缀），字面意为‘使进入’，引申为‘模仿’。联想：模仿者（imitator）像‘进入’别人世界一样去复制。","similar_words":"imitation（模仿）vs. copy（复制）：imitation 强调学习或仿效过程，常含艺术或行为层面；copy 侧重机械复制，如复印文件或抄袭。","phonetic":"/ˌɪməˈteɪʃən/"},{"id":"W000374","sourceRow":"375","word":"improper","translate":"不恰当的；不合适的；不正当的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"im-（不）+ proper（恰当的），字面意为“不恰当的”。可联想为“不守规矩（improper behavior）”。","similar_words":"与improperly（副词）对比：improper是形容词，修饰名词；improperly是副词，修饰动词或形容词，表示“不恰当地”。","phonetic":"/ˌɪmˈprɑpər/"},{"id":"W000375","sourceRow":"376","word":"indefinite","translate":"adj. 不确定的；无限制的；无限的；n. 无限期","number":"3","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 in-（不）+ definite（确定的），字面意为“不确定的”。联想：indefinite 常用来形容时间或期限模糊不清，如 indefinite leave（无限期休假）。","similar_words":"与 indefinite 易混淆的词：indefinite 强调“不确定”或“无限制”，而 definite 强调“确定的”或“明确的”。例如：indefinite leave（无限期休假）vs. definite leave（明确期限的休假）。","phonetic":""},{"id":"W000376","sourceRow":"377","word":"induce","translate":"v. 诱导；引起；说服；导致","number":"3","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 indu-（进入、引起）+ -ce（名词后缀），动词形式。联想：诱导某人进入某种状态或行为。","similar_words":"与 inspire 对比：induce 强调通过外部手段（如劝说、刺激）使某人产生某种反应或进入某种状态；inspire 更侧重内在的激励或启发，常与灵感、勇气搭配。","phonetic":"/ˌɪnˈdus/"},{"id":"W000377","sourceRow":"378","word":"iron","translate":"n. 铁；adj. 铁的；v. 用铁锻造；adj. 坚定的；adj. 枯燥的","number":"3","part_of_speech":"n.; adj.; v.","transformation":"无","memory_techniques":"词根 iron 意为“铁”，联想“铁打的江山”代表坚定，或“铁锈”代表金属。","similar_words":"无","phonetic":"/aɪərn/"},{"id":"W000378","sourceRow":"379","word":"jam","translate":"n.果酱；v.堵塞；挤满；v.（使）变硬；n.（交通）堵塞","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 jam 原意与“挤压”有关，联想为把东西挤在一起（如交通堵塞）或把水果压成果酱。","similar_words":"jam 与 jam 同形，但 jam 作动词时强调“堵塞”或“挤满”的动作，而 jam 作名词时多指“果酱”或“堵塞”的状态；注意不要与 jam（动词，使变硬）混淆，后者多用于材料变硬语境。","phonetic":"/ʤæm/"},{"id":"W000379","sourceRow":"380","word":"junction","translate":"n. 连接处；汇合点；（铁路、公路等的）交叉点","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 junction 可联想为 'join'（连接）+ 'tion'（名词后缀），字面意思就是‘连接在一起的地方’。","similar_words":"无","phonetic":"/ˈʤəŋkʃən/"},{"id":"W000380","sourceRow":"381","word":"keen","translate":"adj. 敏锐的；热心的；强烈的；n. 敏锐；热情","number":"3","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 keen 源自古英语，与 knife（刀）同源，形象地表示‘像刀锋一样敏锐’。联想：keen 像刀锋一样锋利，形容目光敏锐或兴趣浓厚。","similar_words":"keen 与 sharp 都表示‘敏锐’，但 keen 多用于形容兴趣、渴望或天气（如 keen interest, keen weather），而 sharp 更侧重智力、疼痛或批评的尖锐（如 sharp mind, sharp pain）。","phonetic":"/kin/"},{"id":"W000381","sourceRow":"382","word":"lap","translate":"n. 圈，圈地；v. 环抱，环绕；n. 一餐，一顿饭；n. 臀部，屁股","number":"3","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"联想：lap 像是一个小篮子（lap 形状），用来装东西（如食物、孩子），所以有‘一餐’或‘环抱’的意思。","similar_words":"无","phonetic":"/læp/"},{"id":"W000382","sourceRow":"383","word":"lime","translate":"n. 石灰；柠檬；n. 柠檬色；adj. 柠檬色的","number":"3","part_of_speech":"n.; adj.","transformation":"无","memory_techniques":"词根联想：lime 与 lemon（柠檬）同源，都来自拉丁语 limo（酸味），可联想为‘酸涩的石头’即石灰，或‘黄色的水果’即柠檬色。","similar_words":"无","phonetic":""},{"id":"W000383","sourceRow":"384","word":"magnitude","translate":"n. 大小；程度；重要性；巨大","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 mag-（大）+ -nitude（程度/状态），字面意为‘巨大的程度’。可联想为‘magnitude’即‘大度’或‘宏大’，常用于形容灾难、宇宙或抽象概念的巨大。","similar_words":"与mass区别：mass指‘质量’或‘大量’（常作不可数名词，如a mass of people），而magnitude强调‘规模、程度或重要性’（常可数，如of great magnitude）。与size区别：size仅指‘尺寸’，不强调抽象的‘重要性’。","phonetic":"/ˈmægnəˌtud/"},{"id":"W000384","sourceRow":"385","word":"mild","translate":"adj. 温和的；轻微的；温和的；（性格）温和的","number":"3","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 mild 源自拉丁语，与“柔软、温和”相关。联想：mild 让人想到“mild tea”（淡茶）或“mild weather”（温和天气），即不强烈、不刺激的状态。","similar_words":"与 gentle 对比：mild 侧重程度低、不强烈（如 mild fever 低烧，mild manner 温和举止）；gentle 侧重动作或态度轻柔、不粗暴（如 gentle touch 轻柔触摸，gentle voice 温柔嗓音）。","phonetic":"/maɪld/"},{"id":"W000385","sourceRow":"386","word":"mill","translate":"n. 磨坊；n. 大量；n. 千（用于计量）","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词根mill来自拉丁语，原意与‘磨’有关，可联想为‘磨坊’。mill也是计量单位，如million（百万），可联想为‘千’的倍数单位。","similar_words":"无","phonetic":"/mɪl/"},{"id":"W000386","sourceRow":"387","word":"multit ，vehicle 即‘运载工具’。联想：车（vehicle）用来运载人或物。","similar_words":"无","phonetic":"/ˈviɪkəl/"},{"id":"W000417","sourceRow":"418","word":"yard","translate":"n. 院子；场地；度量单位（英制，1 yard=3英尺）","number":"3","part_of_speech":"n.","transformation":"无","memory_techniques":"词源联想：'yard' 与 'yardstick'（皮尺）相关，古代用皮尺丈量土地或院子大小，故引申为‘场地’或‘度量单位’。","similar_words":"无","phonetic":"/jɑrd/"},{"id":"W000418","sourceRow":"419","word":"abide","translate":"v. 遵守；忍受；存在；停留","number":"2","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 abide 可联想为 'ab' (away) + 'ide' (side)，字面意为 'stay away'，引申为 '忍受' 或 '遵守'（如 abide by rules）。","similar_words":"与 obey 对比：abide 强调被动接受或容忍（如 abide by the law），侧重规则约束；obey 强调主动服从命令，侧重权威关系。","phonetic":"/əˈbaɪd/"},{"id":"W000419","sourceRow":"420","word":"accuse","translate":"v. 指控；指责；控告","number":"2","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 accuse 可联想为 'acc' (注意) + 'use' (使用)，即‘注意使用某人’，引申为‘指控某人’。也可联想为 'acc' (强调) + 'use' (使用)，即‘强调使用某人’，引申为‘指责某人’。","similar_words":"accuse 与 charge 的区别：accuse 强调主观上的指责或控告，常接 accus sb. of sth.；charge 更侧重法律上的正式指控，常接 charge sb. with sth.。","phonetic":"/əˈkjuz/"},{"id":"W000420","sourceRow":"421","word":"acquaintance","translate":"n. 相识；熟人；v. 使了解；使熟悉","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 ac-（达到）+ quaint（奇怪）+ -ance（名词后缀），字面意为‘变得熟悉’，引申为‘熟人’或‘了解’。","similar_words":"acquaintance（熟人）vs. acquaintance（了解）：作名词时，acquaintance 既指‘熟人’，也指‘对某事的了解’；作动词时，意为‘使某人了解某事’，常接双宾语（acquaint sb. with sth.），强调建立联系或传递信息。","phonetic":"/əkˈweɪntəns/"},{"id":"W000421","sourceRow":"422","word":"amuse","translate":"v. 使娱乐；逗乐；使发笑","number":"2","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 amus- 意为‘吃’，引申为‘逗乐’（让人开心得‘吃’掉烦恼）；联想：amuse 让人开心，就像把烦恼‘吃掉’一样。","similar_words":"与entertain区别：amuse侧重引起短暂或轻微的欢笑，entertain侧重提供娱乐活动或陪伴消遣，后者更正式且持续时间更长。","phonetic":"/əmˈjuz/"},{"id":"W000422","sourceRow":"423","word":"awful","translate":"adj. 可怕的；糟糕的；严重的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 awful 可联想为 'aw' (醒) + 'ful' (充满)，即‘充满恐惧’，引申为可怕；另可联想为 'aw' (啊，惊叹) + 'ful'，表示程度深，故指糟糕的。","similar_words":"与 awful 易混淆的词：awful 和 awful 同形，但需注意其古义为‘令人敬畏的’，现代考研中主要考贬义‘糟糕的’；与 awful 对比，awful 强调负面程度，而 awful 无此区别，故无需额外辨析。","phonetic":"/ˈɔfəl/"},{"id":"W000423","sourceRow":"424","word":"bargain","translate":"n.便宜货；v.讨价还价；n.交易；v.以优惠价格购买","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 bargain 源自古法语 bargaine，意为‘交易’。联想：‘bar’（柜台）+‘gain’（获利），在柜台讨价还价以获利。","similar_words":"bargain 与 deal 相似，但 bargain 强调‘低价’和‘讨价还价’的过程，常含‘划算’之意；deal 更侧重‘交易’本身或‘协议’，不一定涉及价格谈判。","phonetic":"/ˈbɑrgɪn/"},{"id":"W000424","sourceRow":"425","word":"brick","translate":"砖；砖块；坚固的；笨拙的","number":"2","part_of_speech":"n.; adj.","transformation":"无","memory_techniques":"词根 brick 源自原始印欧语 *bherk-，意为‘推’或‘筑’，形象地描绘了堆砌砖块的动作。联想：像砌墙一样一块块堆叠，引申为‘笨拙’或‘不灵活’。","similar_words":"无","phonetic":"/brɪk/"},{"id":"W000425","sourceRow":"426","word":"bulk","translate":"n. 大量；主体部分；v. 占据（大量空间或时间）","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 bulk 源自原始印欧语 *balk-，意为‘推、撑’，引申为‘大量’或‘主体’。联想：像推倒一堵墙（bulk）一样，占据很大空间。","similar_words":"bulk 与 mass 区别：mass 强调‘质量’或‘整体’，常指人或物体的总称；bulk 强调‘体积’或‘数量上的主体部分’，常指某物在总量中占大部分。","phonetic":"/bəlk/"},{"id":"W000426","sourceRow":"427","word":"capitalism","translate":"资本主义；首都；重要的；主要的","number":"2","part_of_speech":"n.; adj.","transformation":"无","memory_techniques":"词根 cap-（抓、拿）+ -ital（形容词后缀）+ -ism（名词后缀，表示制度或状态）。字面意思为‘抓取的制度’，引申为通过资本积累和私有制运作的经济制度。","similar_words":"无","phonetic":""},{"id":"W000427","sourceRow":"428","word":"charter","translate":"n.特许状，宪章；v.特许，租用（车辆等）","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"char-（特征）+ -ter（人/物），字面意为‘具有特征的人’，引申为‘特许状’（官方赋予的特征/权利）；也可联想为‘charter bus’（包车），即租用车辆。","similar_words":"无","phonetic":"/ˈʧɑrtər/"},{"id":"W000428","sourceRow":"429","word":"chase","translate":"v. 追赶；追逐；追捕；n. 追逐；追捕","number":"2","part_of_speech":"v.; n.","transformation": aste 源自拉丁语，意为“奔跑”，联想为“匆忙奔跑”即“匆忙”。","similar_words":"haste 与 hurry 同义，但 haste 更侧重“匆忙的状态或行为”，常作名词；hurry 更侧重“催促的动作”，常作动词。","phonetic":"/heɪst/"},{"id":"W000469","sourceRow":"470","word":"hatred","translate":"n. 憎恨；仇恨","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 hate（憎恨）+ suffix -red（名词后缀，表示状态或行为），直译即‘憎恨的状态’。","similar_words":"与 hate 对比：hate 作动词时强调‘憎恨’的动作或情感本身，作名词时也可指憎恨；hatred 专指憎恨的强烈情感或状态，常作名词使用，语气比 hate 更重。","phonetic":"/ˈheɪtrəd/"},{"id":"W000470","sourceRow":"471","word":"hell","translate":"地狱；极度的痛苦或愤怒；（口语）糟糕透顶","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词源联想：Hell 源自古英语 hel，意为‘痛苦之地’。可联想为‘H’形地狱之门，或‘Hell’与‘Hellfire’（地狱之火）的关联，帮助记忆其负面含义。","similar_words":"无","phonetic":"/hɛl/"},{"id":"W000471","sourceRow":"472","word":"hydrogen","translate":"氢；氢元素","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 hydro- 意为‘水’，因为氢气燃烧产生水，故联想为‘水’的兄弟元素。","similar_words":"无","phonetic":"/ˈhaɪdrəʤən/"},{"id":"W000472","sourceRow":"473","word":"implement","translate":"n. 工具，器械；v. 实施，执行","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 im-（进入）+ plement（补充），字面意为‘补充进去的工具’，引申为执行计划所需的工具或行动。","similar_words":"implement 与 instrument 区别：implement 多指具体的工具或器械（如锄头、电脑），常作动词‘实施’；instrument 多指抽象的‘仪器’或‘手段’，也可指法律文件，作动词时意为‘促成’。","phonetic":"/ˈɪmpləmənt/"},{"id":"W000473","sourceRow":"474","word":"incapable","translate":"adj. 没有能力的；不能的；无能的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 in-（不）+ capable（能够），字面意思为‘不能’。可联想为‘无法胜任’。","similar_words":"与 unable 同义，但 incapable 更强调缺乏内在能力或资格，常接 at/in doing sth.；unable 侧重客观条件限制。","phonetic":""},{"id":"W000474","sourceRow":"475","word":"indication","translate":"n. 迹象，表明，指示；v. 表明，显示","number":"2","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 indic-（指示）+ -ation（名词后缀），联想：indicate（指示）的名词形式，即‘指示’或‘迹象’。","similar_words":"与sign不同，sign更侧重‘标志’或‘符号’，常指具体可见的标记；indication更侧重‘暗示’或‘证据’，多用于抽象语境或 cient 强调数量或程度未达到要求（如资金、时间），常接 for；inadequate 强调质量或能力不足，常接 for 或 to。例如：insufficient evidence（证据不足）vs inadequate preparation（准备不充分/能力不足）。","phonetic":"/ˌɪnsəˈfɪʃənt/"},{"id":"W000480","sourceRow":"481","word":"interval","translate":"间隔；期间；间歇；（时间、空间上的）距离","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 inter-（在...之间）+ -val（走、移动），字面意思为‘在中间行走’，引申为‘间隔’或‘期间’。","similar_words":"interval与space：interval强调时间或空间上的‘间隔’、‘空隙’（如时间间隔、两数之间的差）；space更侧重‘空间’、‘领域’或‘空白’。","phonetic":"/ˈɪntərvəl/"},{"id":"W000481","sourceRow":"482","word":"intervene","translate":"v. 干预；介入；插嘴；n. 干预；介入","number":"2","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 inter-（在...之间）+ vene（来，来自venire），字面意思为“从中间来”，引申为在双方之间介入。联想：像调解员一样站在冲突双方中间进行干预。","similar_words":"与interfere对比：intervene强调在第三方介入以解决冲突或阻止事态发展，常接in；interfere更侧重干扰、妨碍，常接with。例如：The police intervened in the fight（警察介入打斗）vs. The noise interfered with my study（噪音干扰了我的学习）。","phonetic":"/ˌɪntərˈvin/"},{"id":"W000482","sourceRow":"483","word":"Jewish","translate":"犹太人的；犹太教的；犹太人","number":"2","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 Jew 意为‘犹太人’，加后缀 -ish 表示‘属于...的’，类似 British（英国的）、French（法国的）","similar_words":"无","phonetic":""},{"id":"W000483","sourceRow":"484","word":"knot","translate":"","number":"2","part_of_speech":"","transformation":"","memory_techniques":"","similar_words":"","phonetic":"/nɑt/"},{"id":"W000484","sourceRow":"485","word":"lens","translate":"n. 透镜；镜头；镜片；n. 眼；眼珠","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 lens 意为“眼睛”，联想：眼睛需要透镜（lens）来聚焦光线看清物体。","similar_words":"无","phonetic":"/lɛnz/"},{"id":"W000485","sourceRow":"486","word":"magnificent","translate":"adj. 壮丽的；宏伟的；极好的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 magn-（大）+ -ificent（形容词后缀，表示‘充满...的’），字面意为‘充满伟大的’。联想：巨大的宫殿或风景令人惊叹，故用 magnificent 形容。","similar_words":"与 magnificent 易混淆的词：magnificent（宏伟的，侧重规模或气势大）vs. magnificent（极好的，侧重质量高或令 sourceRow":"518","word":"subscribe","translate":"订阅；同意；报名；（报刊等）订阅","number":"2","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 sub-（向下、从下）+ scribe（写），字面意为‘从下书写’，引申为‘订阅’（定期接收）或‘同意’（从下支持）。","similar_words":"subscribe与inscribe区别：subscribe指‘订阅’或‘同意’，对象常为报刊、服务或观点；inscribe指‘刻写’或‘题写’，对象常为文字、名字于物体表面。","phonetic":"/səbˈskraɪb/"},{"id":"W000518","sourceRow":"519","word":"suspicious","translate":"可疑的；怀疑的；令人怀疑的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 sus-（向上、隐藏）+ picious（像...的），字面意为“隐藏起来的”，引申为“可疑的”。联想：心里藏着鬼，所以让人怀疑。","similar_words":"suspicious 与 suspect 区别：suspicious 是形容词，作定语或表语（如：suspicious behavior）；suspect 既可是动词（怀疑某人）也可是名词（嫌疑人），侧重指代人或动作。","phonetic":"/səˈspɪʃəs/"},{"id":"W000519","sourceRow":"520","word":"swift","translate":"adj. 迅速的；敏捷的；n. 快速；迅疾","number":"2","part_of_speech":"adj.; n.","transformation":"无","memory_techniques":"词根 swift 源自古英语，意为“快速移动”，联想为“像风一样快”。","similar_words":"与 quick 对比：quick 强调反应快或时间短，swift 强调速度极快或动作流畅。","phonetic":"/swɪft/"},{"id":"W000520","sourceRow":"521","word":"symptom","translate":"症状；征兆；迹象","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 sym-（共同、一起）+ ptom（表现、显示），字面意为‘共同表现’，引申为疾病或情况共同显现的‘症状’。","similar_words":"无","phonetic":"/ˈsɪmptəm/"},{"id":"W000521","sourceRow":"522","word":"tractor","translate":"n. 拖拉机；牵引车","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 tract- 意为‘拉、拖’，前缀 tra- 加强语气，合起来就是‘用来拉东西的机器’，联想为拖拉机拉着农具在田间作业。","similar_words":"无","phonetic":"/ˈtræktər/"},{"id":"W000522","sourceRow":"523","word":"trivial","translate":"adj. 琐碎的；微不足道的；平凡的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 tri-（三）+ -ivial（不重要的），字面意为“三件小事”，引申为琐碎、微不足道。可联想为“三瓜两枣”不值一提。","similar_words":"trivial 与 triviality 区别：trivial 是形容词，修饰名词；triviality 是名词，指“琐碎之事”。trivial 与 insignificant 区别：trivial 侧重“琐碎、无关紧要”，常指细节；insignificant 侧重“不重要、无意义”，程度更深，常指整体价值。","phonetic":"/ˈtrɪviəl/"},{"id":"W000523","sourceRow":"524","word":"velocity","translate":"速度；速率；速度；快慢","number":"2","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 vel-（跑、移动）+ -ity（名词后缀，表示状态或性质），字面意思为‘跑的状态’，引申为物体移动的速度。","similar_words":"与speed区别不大，但velocity强调矢量（有方向），speed仅指速率（标量）；在物理语境中，velocity常指瞬时速度，而speed指平均速度或单纯快慢。","phonetic":"/vəˈlɑsəti/"},{"id":"W000524","sourceRow":"525","word":"vigorous","translate":"adj. 精力充沛的；强健的；猛烈的； vigorous 的","number":"2","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 vig-（意为‘生命、活力’）+ -orous（形容词后缀，表示‘充满...的’），联想为‘充满活力的’。","similar_words":"vigorous 与 energetic 均表示‘精力充沛’，但 vigorous 更强调‘强健有力、猛烈’，常修饰运动、训练或行动（如 vigorous exercise）；energetic 侧重‘有活力的、热情的’，适用范围更广。","phonetic":"/ˈvɪgərəs/"},{"id":"W000525","sourceRow":"526","word":"whereas","translate":"然而；但是；尽管；虽然","number":"2","part_of_speech":"conj.","transformation":"无","memory_techniques":"词根 where 意为‘哪里’，as 意为‘像’，合起来表示‘像哪里一样’，引申为‘尽管’或‘然而’，用于连接两个对比或转折的从句。","similar_words":"与 but 对比：but 是并列连词，连接两个对等的句子或短语，语气较简单；whereas 是从属连词，连接两个完整的从句，强调前后内容的对比或转折，语气更正式，常用于法律或学术文本。","phonetic":"/wɛˈræz/"},{"id":"W000526","sourceRow":"527","word":"zone","translate":"n. 区域；地带；区；v. 分区；使成为区域","number":"2","part_of_speech":"n.; v.","transformation":"zones; zoned","memory_techniques":"词根 zon- 意为‘圈’或‘带’，如 zone 可联想为‘圆圈’围成的区域。","similar_words":"无","phonetic":"/zoʊn/"},{"id":"W000527","sourceRow":"528","word":"absorption","translate":"n. 吸收；吸收力；专心；吸收率","number":"1","part_of_speech":"n.","transformation":"无","memory_techniques":"由动词 absorb（吸收）加后缀 -tion 构成，表示吸收的动作或过程。联想：像海绵吸水一样，把知识‘吸’进大脑就是 absorption（专心学习）。","similar_words":"与 absorption 易混淆的词：absorb（动词，吸收）；区别：absorb 是动作，absorption 是名词，指吸收的过程、结果或状态。考研中常考固定搭配：be absorbed in（专心于）= be absorbed in absorption（较少见，通常用前者）","phonetic":""},{"id":"W000528","sourceRow":"529","word":"absurd","translate":"荒谬的；可笑的；不合理的","number":"1","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 absurd 源自拉丁语 absurdus，由 ad-（向）+ surdus（聋的）组成，字面意为“听不见的”，引申为“荒谬的、不合逻辑的”。","similar_words":"与 ridiculous（滑稽 e no reservation）或‘酒店预订’（hotel reservation）两种用法。","phonetic":"/ˌrɛzərˈveɪʃən/"},{"id":"W000735","sourceRow":"736","word":"reservoir","translate":"水库；蓄水池；储备；贮存","number":"1","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 reservoir 可联想为 'res' (水) + 'servoir' (储存)，字面意为‘储水之地’。记住它是用来存水或存物资的地方。","similar_words":"无","phonetic":"/ˈrɛzəvˌwɑr/"},{"id":"W000736","sourceRow":"737","word":"resolution","translate":"n. 决议；决定；决心；v. 解决；使清晰","number":"1","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 resol-（解开、溶解）+ -ution（名词后缀，表示动作或结果），字面意为‘解开’，引申为‘解决’或‘决心’。","similar_words":"resolution（解决、决议）与solution（解答、解决方案）：resolution 强调通过努力达成决定或消除问题（如 resolve a conflict），侧重过程与决心；solution 更侧重最终的答案或具体的解决办法（如 the solution to the problem）。","phonetic":"/ˌrɛzəˈluʃən/"},{"id":"W000737","sourceRow":"738","word":"revenge","translate":"复仇；报复；n. 复仇；v. 报复","number":"1","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 revenge 可联想为 're' (再次) + 'venge' (伤害/报复)，即‘再次伤害’以寻求平衡，常用于‘以牙还牙’的语境。","similar_words":"revenge 强调为受的伤害而主动报复，常接介词 for；而retaliation 更侧重‘反击’或‘回击’，多用于法律或正式场合，不强调个人情感色彩。","phonetic":"/riˈvɛnʤ/"},{"id":"W000738","sourceRow":"739","word":"revolt","translate":"n. 叛乱，反抗；v. 叛变，反抗；v. 使反感，使愤慨","number":"1","part_of_speech":"n.; v.","transformation":"无","memory_techniques":"词根 rev-（回，向后）+ volt（转，来自拉丁语volvere，意为转动）。字面意思为‘向后转’，引申为‘背叛’或‘反抗’，即背弃原有立场。","similar_words":"revolt 与 rebel 均指反抗，但 revolt 更强调公开、激烈的政治或社会反抗（如 civil revolt），常作名词；rebel 侧重个人不服从权威的行为，既可作名词也可作动词，语气相对较轻。","phonetic":"/rɪˈvoʊlt/"},{"id":"W000739","sourceRow":"740","word":"rid","translate":"v. 摆脱；清除；使发笑；n. 摆脱；清除","number":"1","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 rid- 意为“清除、去除”，联想 rid 为“清除身上负担”的动作，如 rid oneself of（摆脱）。","similar_words":"与 rid 易混淆的词：remove（移除，侧重物理或抽象的拿开）；rid 更强调彻底摆脱某种负担、麻烦或厌恶的事物，常接 of 结构。","phonetic":"/rɪd/"},{"id":"W000740","sourceRow":"741","word":"ridge","translate":"n. 山脊；山梁；脊背；v. 形成山脊；使隆起","number":"1","part_of_speech":"n.; v.", 与 artificial 对比：synthetic 强调通过化学或物理手段‘合成’（如 synthetic leather 人造革），侧重物质构成；artificial 范围更广，指‘非自然’的（如 artificial intelligence 人工智能），侧重功能或来源非天然。","phonetic":"/sɪnˈθɛtɪk/"},{"id":"W000782","sourceRow":"783","word":"tame","translate":"驯服的；驯化；使驯服；使温顺；n. 驯兽师","number":"1","part_of_speech":"adj.; v.; n.","transformation":"无","memory_techniques":"词根 tame 源自拉丁语 tamis（筛子），形象地表示像筛子一样过滤掉野性，只留下温顺。联想：tame 猫（家猫）vs. wild 猫（野猫）。","similar_words":"tame 与 tamed 区别：tame 是形容词或原形动词，表示状态或动作；tamed 是过去式或过去分词，强调被驯化的结果。例如：a tame cat（一只温顺的猫）vs. The tiger was tamed（老虎被驯化了）。","phonetic":"/teɪm/"},{"id":"W000783","sourceRow":"784","word":"tedious","translate":"adj. 冗长的；乏味的；单调的","number":"1","part_of_speech":"adj.","transformation":"无","memory_techniques":"词根 ted- 意为‘坐’，tedious 原指‘坐着度过的漫长时光’，引申为枯燥乏味。联想：tedious 让人想躺下坐着不动，因为太无聊了。","similar_words":"与 boring 对比：boring 侧重主观感受‘令人厌烦’，tedious 侧重客观描述‘过程冗长单调’，常修饰阅读、工作等持续性活动。","phonetic":"/ˈtidiəs/"},{"id":"W000784","sourceRow":"785","word":"terrify","translate":"使...恐惧；吓坏；使惊恐","number":"1","part_of_speech":"v.","transformation":"无","memory_techniques":"词根 terr- 意为“土地”，联想“土地被破坏”或“大地颤抖”从而引发恐惧；后缀 -ify 表示“使...化”。","similar_words":"terrify 与 frighten 相比，terrify 程度更深，指极度恐惧、骇人听闻；frighten 指一般性的惊吓。terrify 常接宾语，frighten 也可接宾语或不定式。","phonetic":"/ˈtɛrəˌfaɪ/"},{"id":"W000785","sourceRow":"786","word":"testify","translate":"作证；证明；证实；v. 证明；n. 证明；证据","number":"1","part_of_speech":"v.; n.","transformation":"无","memory_techniques":"词根 test（测试）+ ify（使...化），字面意为“通过测试来证明”，联想为“经过检验后给出证明”。","similar_words":"testify 与 prove 区别：testify 侧重提供证据或口头作证（如法庭作证），prove 侧重逻辑上或事实上被证实为真。","phonetic":"/ˈtɛstəˌfaɪ/"},{"id":"W000786","sourceRow":"787","word":"thermometer","translate":"温度计；体温计","number":"1","part_of_speech":"n.","transformation":"无","memory_techniques":"词根 thermo- 意为‘热’，-meter 意为‘测量仪器’，合起来就是‘测量温度的仪器’。联想：thermo 让人想到热浪，meter 让人想到测量，热浪需要温度计来测量。","similar_words":"无","phonetic":"/θərˈmɑmətər/"},{"id":"W000787","sourceRow":"788","word":"thirsty","translate":"adj. 口渴的；渴望的；n. 渴望；渴求","numbe         searchResults.classList.remove('open');
        const first = searchItems(search.value)[0];
        if (first) locate(first.id); else openDictionary(search.value);
      }
    });
    document.getElementById('review-only').addEventListener('change', event => { state.reviewOnly = event.target.checked; setQuery(search.value); });
    document.getElementById('previous-page').addEventListener('click', () => turnPage(-1));
    document.getElementById('next-page').addEventListener('click', () => turnPage(1));
    document.getElementById('resume').addEventListener('click', () => {
      const id = state.lastId;
      state.reviewOnly = false;
      document.getElementById('review-only').checked = false;
      search.value = '';
      setQuery('');
      if (id) locate(id);
    });
    function backupData() {
      const item = byId.get(state.lastId);
      return { format: 'vocabulary-study', version: 2, exportedAt: new Date().toISOString(), records: [...records.values()], position: item ? { word: wordKey(item.word), at: Date.now() } : null };
    }
    function importData(data) {
      if (!data || data.format !== 'vocabulary-study' || data.version !== 2 || !Array.isArray(data.records) || data.records.length > 100000
        || !data.records.every(validRecord) || (data.position !== null && !validPosition(data.position))) throw new Error('备份格式无效或版本不支持');
      // Validate the whole file before touching existing records. Newer marks win, including removals.
      for (const entry of data.records) {
        const key = wordKey(entry.word);
        if (!key) throw new Error('备份包含空白单词');
      }
      for (const entry of data.records) {
        const key = wordKey(entry.word);
        const current = records.get(key);
        const disk = readSaved(recordKey(key), validRecord);
        const latest = disk && (!current || disk.at > current.at) ? disk : current;
        if (!latest || entry.at > latest.at) {
          const record = { word: key, review: entry.review, at: entry.at };
          records.set(key, record);
          writeSaved(recordKey(key), record);
        } else if (latest) records.set(key, latest);
      }
      const saved = readSaved(POSITION_KEY, validPosition);
      if (data.position && (!saved || data.position.at > saved.at)) {
        writeSaved(POSITION_KEY, data.position);
        state.lastId = byWord.get(wordKey(data.position.word))?.id || state.lastId;
      }
      setQuery(search.value, false);
    }
    document.getElementById('export-study').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(backupData(), null, 2)], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url; link.download = `词汇学习记录-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    const importInput = document.getElementById('import-file');
    document.getElementById('import-study').addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', async () => {
      const file = importInput.files[0];
      if (!file) return;
      try {
        if (file.size > 20 * 1024 * 1024) throw new Error('备份文件超过 20 MB');
        importData(JSON.parse(await file.text()));
        storageNotice('备份已合并，已有的较新标记会保留。');
      } catch (error) { storageNotice(`导入失败：${error.message}`); }
      finally { importInput.value = ''; }
    });
    window.addEventListener('storage', event => {
      if (event.key?.startsWith(RECORD_PREFIX) && !event.key.endsWith(':backup') && event.newValue) {
        try {
          const record = JSON.parse(event.newValue);
          const current = records.get(wordKey(record.word));
          if (validRecord(record) && (!current || record.at >= current.at)) { records.set(wordKey(record.word), record); setQuery(search.value, false); }
        } catch (_) { storageNotice('其他窗口的记录无法读取。', true); }
      }
      if (event.key === null || (event.key?.startsWith(RECORD_PREFIX) && !event.newValue)) storageNotice('浏览器中的记录已被清除，请导出当前记录备份。', true);
    });
    function initializeStudy() {
      try {
        const keys = new Set();
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key?.startsWith(RECORD_PREFIX)) keys.add(key.replace(/:backup$/, ''));
        }
        for (const key of keys) { const value = readSaved(key, validRecord); if (value) records.set(wordKey(value.word), value); }
        const position = readSaved(POSITION_KEY, validPosition);
        if (position) state.lastId = byWord.get(wordKey(position.word))?.id || null;
        else {
          const legacy = JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
          if (legacy && byId.has(legacy.id)) { state.lastId = legacy.id; writeSaved(POSITION_KEY, { word: wordKey(byId.get(legacy.id).word), at: Date.now() }); }
        }
        const voice = localStorage.getItem(VOICE_KEY);
        if (['en-GB', 'en-US'].includes(voice)) voiceSelect.value = voice;
      } catch (_) { storageNotice('无法读取本地记录。', true); }
      voiceSelect.addEventListener('change', () => { try { localStorage.setItem(VOICE_KEY, voiceSelect.value); } catch (_) { storageNotice('口音设置未保存。', true); } });
      refreshVoices();
      if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
      if (state.lastId) state.page = Math.floor(VOCAB.findIndex(item => item.id === state.lastId) / BATCH_SIZE);
      renderPage();
    }
    initializeStudy();
  </script>
</body>
</html>
